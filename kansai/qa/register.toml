# ================================================================ limitations (not claims; listed in CAVEATS.md)
[[limitation]]
topic = "Data vintage"
title = "Tsunami map ≠ tsunami text"
text = "The text quotes Wakayama's 2026 scenario (13 m, 5 min). The map shows the 2016 national dataset (A40, based on the prefecture's 2013 assumption), because the 2026 revision is published only as PDF maps. Extents differ in detail."

[[limitation]]
topic = "Data vintage"
title = "River flood layers"
text = "“L2 river flood (max. assumed)” is MLIT A31a (2025 release) for the Kumano. The Ichida flood is A31a's separate maximum-assumed map for the Ichida-gawa itself (市田川, river code 8606010002). Both are river-flood models; neither is a street-level rainfall (pluvial) model."

[[limitation]]
topic = "Models"
title = "Walking distance to dry ground"
text = "Distances are shortest walks over land on a 10 m grid to any dry patch of at least 1 ha. They are not routes to designated evacuation sites and ignore stairs, fences, bridges closed by the quake, crowding and mobility limits. The 1 m/s conversion to minutes is a planning convention."

[[limitation]]
topic = "Models"
title = "60-minute drive area"
text = "Drive times start at the Shingū Medical Center and use OSM roads with assumed speeds (expressway 70, trunk 45, primary 35, secondary 30, tertiary 25 km/h), no traffic and no closures, rasterised at 250 m. They show reach in normal conditions, not after a landslide or flood."

[[limitation]]
topic = "Models"
title = "Landslide exposure of roads"
text = "Road stretches are counted as exposed where they cross an A33 sediment-disaster zone polygon (red or yellow). That shows designated exposure, not the probability of a closure."

[[limitation]]
topic = "Geometry"
title = "Ichida-gawa basin outline"
text = "The dashed outline was digitised from MLIT's printed basin map (図-1.2). It covers 5.85 km², 9% more than the official 5.36 km², so the page quotes the official figure."

[[limitation]]
topic = "Geometry"
title = "Kumano basin"
text = "The basin was delineated from 3″ SRTM elevation (2,365 km²; official 2,360 km²). Prefecture shares come from that outline."

[[limitation]]
topic = "Geometry"
title = "Kumano Kodō routes"
text = "Nakahechi, Kohechi and Iseji follow OSM and Mie Prefecture data. Mie's Iseji KML is “All Rights Reserved”, so its use here needs permission before wide publication. The Ōmine Okugake and Ohechi routes are rebuilt by routing along OSM paths between waypoints; one long leg near Yoshino is drawn straight where no path connects."

[[limitation]]
topic = "Geometry"
title = "Maps are simplified"
text = "Map outlines are simplified for drawing; every statistic is computed on the unsimplified polygons, so recomputing from the drawn shapes gives slightly different decimals."

[[limitation]]
topic = "Drawings"
title = "Valley section"
text = "The long profile follows a D8 flow path on 3″ SRTM with meanders shortened (147 km vs. the official 183 km main-stem length). Coastal hills are schematic and intervention positions are indicative."

[[limitation]]
topic = "Drawings"
title = "Sea lanes and flows"
text = "The timber and charcoal flows follow the Kitayama and Kumano rivers; the sea lanes to Ōsaka and Edo are schematic lines, not historical routes."

