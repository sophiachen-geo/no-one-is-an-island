# Claims register for the Kansai page (kansai/index.html).
#
# Every number a reader can see or hear, and every checkable fact, is listed here with its source.
# kansai/qa/run.py enforces it:
#   * a number on the page that no claim (or identifier) covers → the gate fails;
#   * a claim whose text is no longer on the page → the gate fails (the register cannot drift);
#   * a claim with a `check` is recomputed from the data embedded in the page → must still match.
#
# Fields
#   match   – exact substring(s) as rendered on the page (whitespace collapsed)
#   exact   – short labels that only count when they are the whole text item (chart labels like “86%”)
#   status  – verified    checked against the cited source
#             corrected   the draft differed from the source; the page follows the source
#             derived     computed in this repo from cited data; recomputed on every run by `check`
#             method      a parameter of this repo's own analysis or drawing
#             approximate verified, but the page rounds or simplifies (listed in CAVEATS.md)
#             author      from the author's text, not independently verified (listed in CAVEATS.md)
#   check   – stat (+fmt) | area | share | overlap | length | dist | calc | valley_ve, with expect/tol
#
# Sources were read on 2026-09-30.

# ================================================================ identifiers — numbers that are names
[[identifier]]
pattern = '\bNR\d+\b|National Route 168|Route 168'
why = "road numbers"

[[identifier]]
pattern = '\bL2\b'
why = "hazard level L2 (maximum-class), a name"

[[identifier]]
pattern = '\b(?:A31a|A33|A38|A40|A55|N03)\b'
why = "MLIT 国土数値情報 dataset codes"

[[identifier]]
pattern = 'EPSG:6674|JGD2011|DEM5A|\bD8\b'
why = "names of a CRS, a GSI product and an algorithm"

[[identifier]]
pattern = '図-1\.2|§6'
why = "figure and section references"

[[identifier]]
pattern = 'Typhoon 21'
why = "storm name (平成29年台風第21号)"

[[identifier]]
pattern = '^[1-7]$|^[1-7] · |^[1-7] (?=[a-z])|layers 1–7'
why = "ordinal numbering of the seven layers of function"

[[identifier]]
pattern = 'no one is an island|ONE CITY, SEVERAL GEOGRAPHIES|THE KUMANO AS ONE SYSTEM|Interventions along one system|the dry one|one of that region’s most|cubic metres per second'
why = "titles and idioms, not counts"

