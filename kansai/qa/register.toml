[[claim]]
id = "kmk-test-method"
match = ["lines are cut into pieces of at most 10 m, and a boundary shared by two parcels counts once. Chance comes from sliding the foot’s sequence of directions along the foot by every offset of at least 50 m and recomputing the share each time, so that neighbouring pieces, which are not independent, move together; a run counts only if the result also holds with a minimum offset of 100 m.",
         "Within 25 m, the channel and the lanes bend with the mountain.", "Wherever its local direction differs from the town grid by 10° or more, each piece of a feature (at most 10 m long) counts for whichever of the two it is closer to, parallel or square",
         "Chance comes from sliding the foot’s directions along the foot by 50 m or more, so that its bends meet features they did not shape; shuffling single pieces instead would treat neighbouring pieces as independent and make chance too easy to beat. A run counts as significant only if the result also holds when the slide is at least 100 m. Every test is rerun with each of the four foot definitions and with a second registration of the parcel map: six runs, which check that a result does not hang on those choices (they are not independent samples).",
         "Within 25 m of the foot (steep steps: the 15 m above it), the share of the counted length that follows the foot (dot; buildings weighted by footprint area) against chance (tick: the same features with the foot’s directions slid along it by 50 m or more), and the number of the six runs in which the excess is significant (p < 0.05) with both minimum slides, 50 m and 100 m. Orange: significant in at least 4 of the 6 runs.",
         "Which features follow the mountain foot within 25 m, against chance, with the number of runs in which the result holds"]
exact = ["0%", "25%", "50%", "75%", "100%", "share that follows the foot", "significant in at least 4 of 6 runs", "chance", "runs significant"]
status = "method"
source = "08_align.py: pieces ≤ 10 m (shared parcel boundaries once); local foot direction over ±10 m of the consensus foot; counted only where it differs from the town grid by ≥ 10° (axial, mod 90°); statistic = length-weighted share closer to the foot than to the grid (buildings: footprint area); chance = circular shift of the foot's direction sequence by every offset ≥ 25 profiles (50 m), one-sided p; a run counts as significant only when p < 0.05 with offsets ≥ 25 and ≥ 50 profiles (50 m and 100 m) alike; six runs = consensus foot + each single definition A–D + the similarity registration of the parcel map. The earlier piece-by-piece shuffle (kept as p_perm) treated neighbouring pieces as independent"

