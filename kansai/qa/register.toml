match = ["Where the gods first came down. Kumano Hayatama Taisha places the first descent of the Kumano gods on Gotobiki-iwa",
         "Gotobiki-iwa, where, by tradition, the Kumano gods first came down",
         "first on Gotobiki-iwa, then 石淵 across the river, then the present site, the “new shrine” (新宮)",
         "in the 58th year of Emperor Keikō", "only as one that “is also said” (ともいわれています)"]
status = "verified"
source = "熊野速玉大社, 熊野信仰のはじまり: 「『熊野権現御垂迹縁起』をはじめとする古文献には、熊野の神々は神代の昔、まず神倉山のゴトビキ岩に降臨されたと記されています」 and 「熊野の神々が最初に降り立ったと伝えられる聖地」 (hence “by tradition”, “in the shrine’s account”); 「神倉山に降臨せられた熊野の神々は、次に熊野川の対岸石淵（現貴祢谷）に遷り、さらに景行天皇58年、現在の熊野速玉大社の社地へとお遷りになったと伝えられています。…現在の神倉神社を元宮とし、熊野速玉大社を新宮と称される所以」. Shingū City (info/41): 「新宮と呼んだともいわれています」 (hence “is said”)"
url = "https://kumanohayatama.jp/history/"

[[claim]]
