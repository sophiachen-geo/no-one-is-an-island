# Independently sourced coordinates for every named point the Kansai page draws.
# kansai/qa/run.py projects each (lon, lat) with its own Gauss–Krüger code and fails if the page's
# point is further than tol_m from it, or if the page draws a point that has no entry here.
#
# tol_m by feature class: a building, shrine, station or structure 150 m; a dam 200 m (crest vs.
# polygon centre); an approximate or historic place 300 m; a town or district label 500 m.
# Refresh with: python3 kansai/qa/verify_points.py   (queries OpenStreetMap / Nominatim)
# Checked 2026-09-30.

