name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Accuracy gate for the Kansai page: nothing is published unless it passes (see kansai/qa/).
  qa:
    uses: ./.github/workflows/kansai-qa.yml
    with:
      deploy: true

  build:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Both pages are static (the Kansai map data is generated offline by kansai/tools and
      # inlined; building footprints and photographs sit beside the page), so there is no
      # build step — we just stage them into a folder.
      - name: Stage site
        run: |
          mkdir -p _site/kansai
          cp index.html _site/index.html
          cp kansai/index.html _site/kansai/index.html
          if [ -d kansai/data ]; then cp -r kansai/data _site/kansai/data; fi
          if [ -d kansai/img ]; then cp -r kansai/img _site/kansai/img; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages (with the GitHub Actions source) if it
          # has not been turned on yet in the repo settings.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
